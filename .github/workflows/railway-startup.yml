name: Railway startup verification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build both OMNI reference images
        run: |
          set -euo pipefail
          docker build --pull --tag omni-sandbox:pr services/omni-sandbox
          docker build --pull --tag omni-autonomous:pr services/omni-autonomous
      - name: Verify sandbox container defaults and read-only/no-network startup
        run: |
          set -euo pipefail
          docker run --detach --name omni-sandbox-pr \
            --read-only --network none --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /sandbox:rw,nosuid,nodev,size=64m \
            --memory 512m --cpus 1 --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env OMNI_SANDBOX_CLIENT_ID=mothership-test \
            --env OMNI_SANDBOX_HMAC_SECRET=tttttttttttttttttttttttttttttttttttttttttttttttt \
            omni-sandbox:pr
          for attempt in $(seq 1 30); do
            if docker exec omni-sandbox-pr node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker inspect omni-sandbox-pr --format \
                'privileged={{.HostConfig.Privileged}} capAdd={{json .HostConfig.CapAdd}} capDrop={{json .HostConfig.CapDrop}} networkMode={{.HostConfig.NetworkMode}} readonlyRootfs={{.HostConfig.ReadonlyRootfs}}'
              docker rm --force omni-sandbox-pr
              exit 0
            fi
            sleep 1
          done
          docker logs omni-sandbox-pr
          docker rm --force omni-sandbox-pr
          exit 1
      - name: Verify disabled autonomous container health under the same host ceilings
        run: |
          set -euo pipefail
          docker run --detach --name omni-autonomous-pr \
            --read-only --network none --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --memory 512m --cpus 1 --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env OMNI_AUTONOMOUS_ENABLED=false \
            --env OMNI_AUTONOMY_REVIEWED_RELEASE=never-activate \
            --env OMNI_EXECUTOR_CONTROL_SECRET=cccccccccccccccccccccccccccccccc \
            --env OMNI_EXECUTOR_PERMISSION_SECRET=pppppppppppppppppppppppppppppppp \
            --env OMNI_EXECUTOR_PERMISSION_TOKEN=permission-token-at-least-32-characters \
            --env OMNI_LINK_CLIENT_ID=mothership-test \
            --env JACKBOY_LINK_ORIGIN=https://jackboy.example \
            omni-autonomous:pr
          for attempt in $(seq 1 30); do
            if docker exec omni-autonomous-pr node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker inspect omni-autonomous-pr --format \
                'privileged={{.HostConfig.Privileged}} capAdd={{json .HostConfig.CapAdd}} capDrop={{json .HostConfig.CapDrop}} networkMode={{.HostConfig.NetworkMode}} readonlyRootfs={{.HostConfig.ReadonlyRootfs}}'
              docker rm --force omni-autonomous-pr
              exit 0
            fi
            sleep 1
          done
          docker logs omni-autonomous-pr
          docker rm --force omni-autonomous-pr
          exit 1
  jackboy-link-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OMERTA-ROW/jackboy-dev-control
          ref: 3155b88ea99ea434e9940cea5401d89ca24c9464
          path: jackboy-interop
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OMERTA-ROW/Omni
          ref: 8527cd5aba2a0a575c1079b965a8c5bb22f45d6b
          path: omni-interop
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: jackboy-interop
      - name: Run signed cross-repository metadata and TLS suite
        run: node --test jackboy-interop/tests/omni-session.test.mjs
        env:
          MOTHERSHIP_TEST_ROOT: ${{ github.workspace }}
          OMNI_INBOX_DIR: ${{ github.workspace }}/omni-interop/inbox
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
      - name: Test real Jackboy handler using isolated database and verified TLS
        run: node --test tests/jackboy-link-integration.test.mjs
        env:
          JACKBOY_TEST_ROOT: ${{ github.workspace }}/jackboy-interop
      - name: Test scoped dispatch and callbacks across isolated databases
        run: node --test tests/jackboy-dispatch-quarantine.test.mjs tests/jackboy-dispatch-integration.test.mjs
        env:
          JACKBOY_TEST_ROOT: ${{ github.workspace }}/jackboy-interop
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Lint startup regression tests
        run: bunx eslint tests/railway-start.test.mjs src/test/server-entry.test.ts
      - run: bun run test
      - name: Preserve Lovable default build
        run: bun run build
      - name: Verify the actual Railway Node artifact and production listener
        run: bun run test:railway
  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun audit
