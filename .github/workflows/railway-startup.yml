name: Railway startup verification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jackboy-link-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OMERTA-ROW/jackboy-dev-control
          ref: 9f309696a30d6fc4e6f0a66d1e89d4e63a01f8c2
          path: jackboy-interop
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OMERTA-ROW/Omni
          ref: cc083d8e51e0135f536e01f08000de7d8660acbe
          path: omni-interop
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: jackboy-interop
      - name: Run signed cross-repository metadata and TLS suite
        run: node --test jackboy-interop/tests/omni-session.test.mjs
        env:
          MOTHERSHIP_TEST_ROOT: ${{ github.workspace }}
          OMNI_INBOX_DIR: ${{ github.workspace }}/omni-interop/inbox
          GOTOOLCHAIN: local
          GOFLAGS: -mod=mod
      - name: Test real Jackboy handler using isolated database and verified TLS
        run: node --test tests/jackboy-link-integration.test.mjs
        env:
          JACKBOY_TEST_ROOT: ${{ github.workspace }}/jackboy-interop
      - name: Test scoped dispatch and callbacks across isolated databases
        run: node --test tests/jackboy-dispatch-quarantine.test.mjs tests/jackboy-dispatch-integration.test.mjs
        env:
          JACKBOY_TEST_ROOT: ${{ github.workspace }}/jackboy-interop
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Lint startup regression tests
        run: bunx eslint tests/railway-start.test.mjs src/test/server-entry.test.ts
      - run: bun run test
      - name: Preserve Lovable default build
        run: bun run build
      - name: Verify the actual Railway Node artifact and production listener
        run: bun run test:railway
  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun audit
