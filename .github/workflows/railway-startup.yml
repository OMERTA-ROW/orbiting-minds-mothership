name: Railway startup verification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jackboy-link-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OMERTA-ROW/jackboy-dev-control
          ref: ae373d5cccc1964d51e8dbda26c5bfbaea7e045b
          path: jackboy-interop
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: jackboy-interop
      - name: Test real Jackboy handler using isolated database and verified TLS
        run: node --test tests/jackboy-link-integration.test.mjs
        env:
          JACKBOY_TEST_ROOT: ${{ github.workspace }}/jackboy-interop
      - name: Test scoped dispatch and callbacks across isolated databases
        run: node --test tests/jackboy-dispatch-quarantine.test.mjs tests/jackboy-dispatch-integration.test.mjs
        env:
          JACKBOY_TEST_ROOT: ${{ github.workspace }}/jackboy-interop
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - name: Lint startup regression tests
        run: bunx eslint tests/railway-start.test.mjs src/test/server-entry.test.ts
      - run: bun run test
      - name: Preserve Lovable default build
        run: bun run build
      - name: Verify the actual Railway Node artifact and production listener
        run: bun run test:railway
  repository-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun audit
